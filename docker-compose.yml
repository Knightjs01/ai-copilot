services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: ai_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      # The _DB_PASSWORD vars themselves come from env_file (backend/.env) — only the URLs need
      # the postgres/redis hostnames overridden for container networking, so only these are
      # repeated here rather than the whole .env file.
      DATABASE_URL: postgresql+asyncpg://app_runtime:M-OmTe2GooDqjAanKM0JtdVG-nITjTT6@postgres:5432/ai_copilot
      AUTH_DATABASE_URL: postgresql+asyncpg://app_auth:MPEOYhinBZaw-SHx0bqvfud7DwAh5lmT@postgres:5432/ai_copilot
      MIGRATION_DATABASE_URL: postgresql+asyncpg://copilot:copilot@postgres:5432/ai_copilot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # No TTY is ever attached to this container, so pnpm's interactive
      # "confirm modules purge" prompt (triggered when its dependency
      # consistency check wants to reinstall) has nothing to answer and
      # aborts. CI=true is pnpm's own documented fix for exactly this.
      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
